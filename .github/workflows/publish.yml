name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and choose npm dist-tag
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'otomat' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must exactly match the otomat package version.');
          }
          const tag = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - name: Build and pack the release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Publish to npm
        env:
          # Bootstrap with NPM_TOKEN, then remove it after configuring npm OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$RUNNER_TEMP"/npm-package/otomat-*.tgz --provenance --access public --tag "$NPM_DIST_TAG"
